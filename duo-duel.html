<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Duo Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #14285a; font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
.ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(10, 20, 60, .62); backdrop-filter: blur(3px); z-index: 10; animation: fade .2s; }
.ov.hidden { display: none; }
@keyframes fade { from { opacity: 0; } }
.panel { width: min(100%, 390px); max-height: 97dvh; overflow: auto; background: #fff; color: #26384c; border-radius: 28px; padding: 20px 18px 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.4); animation: rise .3s cubic-bezier(.2,1.3,.4,1); }
@keyframes rise { from { transform: translateY(26px) scale(.94); opacity: 0; } }
.panel h1 { margin: 0; font-size: 42px; line-height: 1; color: #2f8cf0; text-shadow: 0 3px 0 #cfe6fc; }
.panel h1 span { color: #ff8a1f; text-shadow: 0 3px 0 #ffe0c2; }
.panel h2 { margin: 0; font-size: 32px; color: #2f8cf0; }
.panel p { margin: 0; font-size: 16px; font-weight: 500; color: #51647a; line-height: 1.3; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g { border: 0; border-radius: 18px; padding: 12px 6px 10px; font-family: inherit; cursor: pointer; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.g:active { transform: translateY(4px); }
.g i { font-style: normal; font-size: 38px; line-height: 1.1; }
.g b { font-size: 19px; }
.g small { font-size: 13px; font-weight: 600; opacity: .92; }
.btn { height: 56px; border-radius: 18px; font-size: 23px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; cursor: pointer; font-family: inherit; background: #36b86b; box-shadow: 0 6px 0 #1f8a45; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f8a45; }
.btn.alt { background: #edf3f9; color: #3b5470; box-shadow: 0 6px 0 #cfdbe8; height: 48px; font-size: 19px; }
.btn.alt:active { box-shadow: 0 2px 0 #cfdbe8; }
.how { display: flex; flex-direction: column; gap: 9px; text-align: left; font-size: 16px; font-weight: 600; color: #3b4f68; }
.how div { display: flex; align-items: center; gap: 11px; }
.how i { flex: none; width: 42px; height: 42px; border-radius: 13px; background: #e6f3ff; display: grid; place-items: center; font-style: normal; font-size: 23px; }
.ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; font-weight: 600; text-align: left; }
.ctrl div { border-radius: 14px; padding: 8px 10px; line-height: 1.3; }
.ctrl .a { background: #e3f0ff; color: #1d5fae; } .ctrl .b { background: #fff0e0; color: #b35a00; }
.ctrl kbd { font-family: inherit; background: #fff; border-radius: 6px; padding: 0 5px; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.note { font-size: 13px !important; color: #7b8da3 !important; }
.big { font-size: 64px; line-height: 1.1; }
.score { font-size: 38px; font-weight: 700; color: #26384c; }
#home { position: fixed; left: 8px; top: 8px; z-index: 5; width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.22); display: none; place-items: center; border: 0; cursor: pointer; }
body.play #home { display: grid; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="home" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7M6 10v9h4v-5h4v5h4v-9"/></svg></button>

<div class="ov" id="menu">
  <div class="panel">
    <h1>Duo <span>Duel</span></h1>
    <p>Two players, one screen. Pick a game!</p>
    <div class="grid" id="grid"></div>
    <p class="note">PC: Player 1 uses <b>W A S D</b> + Space, Player 2 uses <b>arrow keys</b> + Enter.<br>Phone: each player uses their own half of the screen.</p>
  </div>
</div>
<div class="ov hidden" id="tut">
  <div class="panel">
    <div class="big" id="tEmoji"></div>
    <h2 id="tName"></h2>
    <div class="how" id="tHow"></div>
    <div class="ctrl" id="tCtrl"></div>
    <button class="btn" id="tGo">Let's play!</button>
    <button class="btn alt" id="tBack">Back</button>
  </div>
</div>
<div class="ov hidden" id="over">
  <div class="panel">
    <div class="big" id="oEmoji"></div>
    <h2 id="oTitle"></h2>
    <div class="score" id="oScore"></div>
    <p id="oRec"></p>
    <button class="btn" id="oAgain">Rematch</button>
    <button class="btn alt" id="oMenu">Menu</button>
  </div>
</div>

    for (let p = 0; p < 2; p++) {
      if (held[p].L && !held[p].R) { this.px[p] -= spd * dt; this.tx[p] = null; } else if (held[p].R && !held[p].L) { this.px[p] += spd * dt; this.tx[p] = null; }
      else if (this.tx[p] != null) { const d = this.tx[p] - this.px[p], s = 1500 * dt; this.px[p] += Math.abs(d) < s ? d : Math.sign(d) * s; }
      this.px[p] = clamp(this.px[p], PW + 8, W - PW - 8);
    }
    if (M.bt > 0) return; const b = this.ball;
    if (this.cd > 0) { this.cd -= dt; if (this.cd <= 0) { const a = (Math.random() - .5) * 1.0; b.vx = Math.sin(a) * b.sp; b.vy = Math.cos(a) * b.sp * this.dir; } return; }
    b.x += b.vx * dt; b.y += b.vy * dt; this.trail.push([b.x, b.y]); if (this.trail.length > 10) this.trail.shift();
    if (b.x < 14) { b.x = 14; b.vx = Math.abs(b.vx); sfx.bounce(); } else if (b.x > W - 14) { b.x = W - 14; b.vx = -Math.abs(b.vx); sfx.bounce(); }
    const py = [900, 60];
    for (let p = 0; p < 2; p++) {
      const hitY = py[p]; if ((p === 0 && b.vy > 0 && b.y + 14 >= hitY - 10 && b.y < hitY + 14) || (p === 1 && b.vy < 0 && b.y - 14 <= hitY + 10 && b.y > hitY - 14)) {
        if (Math.abs(b.x - this.px[p]) <= PW + 14) { const o = clamp((b.x - this.px[p]) / (PW + 14), -1, 1); b.sp = Math.min(900, b.sp * 1.06 + 8); const a = o * 1.0; b.vx = Math.sin(a) * b.sp; b.vy = -Math.cos(a) * b.sp * (p === 0 ? 1 : -1); b.y = p === 0 ? hitY - 24 : hitY + 24; sfx.bounce(); sfx.tap(p); }
      }
    }
    if (b.y > H + 20) roundEnd(1, null, 1), this.dir = 1; else if (b.y < -20) roundEnd(0, null, 1), this.dir = -1;
  },
  draw() {
    ctx.setLineDash([16, 14]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, MID); ctx.lineTo(W, MID); ctx.stroke(); ctx.setLineDash([]);
    for (let p = 0; p < 2; p++) { const y = p ? 60 : 900; ctx.fillStyle = '#fff'; rr(this.px[p] - 62, y - 10, 124, 20, 10); ctx.fill(); ctx.fillStyle = pc(p); rr(this.px[p] - 62, y + (p ? 0 : -10), 124, 10, 5); ctx.fill(); }
    const b = this.ball; if (!b) return;
    this.trail.forEach((q, i) => { ctx.globalAlpha = i / 25; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(q[0], q[1], 10, 0, 6.283); ctx.fill(); }); ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, 6.283); ctx.fill(); ctx.stroke();
    if (this.cd > 0 && M.bt <= 0) for (let p = 0; p < 2; p++) side(p, () => txt('Ready...', W / 2, 640, 36, '#fff', { stroke: 'rgba(0,0,0,.25)', sw: 8 }));
  }
});

/* ================= flow ================= */
function drawAll() {
  bg(); if (G && M.running) { G.draw(); hud(); banner(); }
}
function tick(dt) {
  if (M.bt > 0) { M.bt -= dt; if (M.bt > 0) G.update(dt); else { M.banner = null; if (M.wins[0] >= M.target || M.wins[1] >= M.target) finish(); else G.round(); } }
  else G.update(dt);
}
let last = 0;
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; t += dt;
  if (G && M.running) {
    tick(dt);
  }
  drawAll(); requestAnimationFrame(loop);
}

function toMenu() { M.running = false; document.body.className = ''; ['tut', 'over'].forEach(i => $(i).classList.add('hidden')); buildMenu(); $('menu').classList.remove('hidden'); }
function buildMenu() {
  const rec = JSON.parse(store.get('dd-rec', '{}'));
  $('grid').innerHTML = GAMES.map((g, i) => { const r = rec[g.id]; return `<button class="g" data-i="${i}" style="background:${g.color};box-shadow:0 5px 0 rgba(0,0,0,.25)"><i>${ic(g.emoji)}</i><b>${g.name}</b><small>${r ? 'P1 ' + r[0] + ' - ' + r[1] + ' P2' : g.tag}</small></button>`; }).join('');
}
function showTut(i) {
  gi = i; const g = GAMES[i]; $('menu').classList.add('hidden'); $('over').classList.add('hidden');
  $('tEmoji').innerHTML = ic(g.emoji); $('tName').textContent = g.name;
  $('tHow').innerHTML = g.how.map(h => `<div><i>${ic(h[0])}</i><span>${h[1]}</span></div>`).join('');
  $('tCtrl').innerHTML = `<div class="a"><b>Player 1 (blue)</b><br>PC: ${g.pcP1}<br>Phone: ${g.touch}</div><div class="b"><b>Player 2 (orange)</b><br>PC: ${g.pcP2}<br>Phone: ${g.touch}</div>`;
  $('tut').classList.remove('hidden');
}
function startMatch() {
  G = GAMES[gi]; M.wins = [0, 0]; M.target = G.target; M.bt = 0; M.banner = null; M.over = false; if (G.start) G.start(); G.round(); M.running = true;
  document.body.className = 'play'; try { document.activeElement.blur(); } catch (_) {} $('tut').classList.add('hidden'); $('over').classList.add('hidden');
}
$('grid').addEventListener('click', e => { const b = e.target.closest('.g'); if (b) showTut(+b.dataset.i); });
$('tGo').onclick = startMatch; $('tBack').onclick = toMenu;
$('oAgain').onclick = () => showTut(gi); $('oMenu').onclick = toMenu; $('home').onclick = toMenu;

/* ---------- input ---------- */
const tp = {};   // pointerId -> player
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
function loc(p, x, y) { return p ? [W - x, H - y] : [x, y]; }
cv.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') touchMode = true; if (!M.running || !G.down) return; const { x, y } = pt(e), p = y < MID ? 1 : 0; tp[e.pointerId] = p; const l = loc(p, x, y);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {} G.down(p, x, y, l[0], l[1]);
});
cv.addEventListener('pointermove', e => { if (!M.running || !G.move) return; if (e.pointerType === 'mouse' && !(e.buttons & 1)) return; const p = tp[e.pointerId]; if (p == null) return; const { x, y } = pt(e); G.move(p, x, y); });
const pup = e => { delete tp[e.pointerId]; }; cv.addEventListener('pointerup', pup); cv.addEventListener('pointercancel', pup);
addEventListener('keydown', e => {
  if (e.key === 'Escape') { toMenu(); return; }
  const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (!k) return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  touchMode = false; held[k[0]][k[1]] = true; if (e.repeat || !M.running || !G.key) return; G.key(k[0], k[1]);
});
addEventListener('keyup', e => { const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (k) held[k[0]][k[1]] = false; });
addEventListener('blur', () => { held[0] = {}; held[1] = {}; });

window.__dd = { show: showTut, start: startMatch, G: () => G, M, press: (p, k) => G.key(p, k), tap: (p, x, y) => { const l = loc(p, x, y); G.down(p, x, y, l[0], l[1]); }, step: tick };
buildMenu(); requestAnimationFrame(loop);
})();
</script>
