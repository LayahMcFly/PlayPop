<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Color Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #23305e; --blue: #2f6df0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: #fff; }
button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; padding: 0; }
.scr { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; }
.scr.hidden, .ov.hidden { display: none; }
.wrap { width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 8px 12px max(10px, env(safe-area-inset-bottom)); }

/* header */
.bar { width: 100%; height: 50px; flex: none; display: flex; align-items: center; gap: 8px; }
.bar h2 { flex: 1; margin: 0; text-align: center; font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rb { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.rb:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.rb svg { width: 22px; height: 22px; }
.rb.back { background: #3ec8ff; } .rb.yel { background: #ffe14a; } .rb.cy { background: #3ec8ff; } .rb.ok { background: #46d36b; } .rb.off { opacity: .4; }
.rb.hint { background: #fff; position: relative; } .rb.hint .n { position: absolute; right: -4px; top: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: #e0406f; color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }

/* free mode */
#free { background: linear-gradient(180deg, #ffc84a, #ffad2b); }
#freeStage, #cbnStage { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
#paper { position: relative; border-radius: 14px; background: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.15), 0 14px 26px rgba(0,0,0,.2); overflow: hidden; touch-action: none; }
#paper > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#under .reg { stroke: none; }
#paint, #over { pointer-events: none; }
#cap { touch-action: none; cursor: crosshair; }
#tools { width: 100%; flex: none; display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
.tl { flex: 1 1 0; max-width: 54px; height: 48px; border-radius: 15px; background: rgba(255,255,255,.88); font-size: 24px; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.tl .pw { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #23305e; background-color: #fff; }
.pw.stripe { background-image: repeating-linear-gradient(45deg, #ef4444 0 3px, #fff 3px 7px); } .pw.dots { background-image: radial-gradient(#ef4444 2.2px, transparent 2.6px); background-size: 8px 8px; } .pw.check { background-image: conic-gradient(#ef4444 25%, #fff 0 50%, #ef4444 0 75%, #fff 0); background-size: 12px 12px; }
.tl.on { background: #fff; outline: 4px solid #2f6df0; transform: translateY(-3px); }
#sizeRow { width: 100%; flex: none; display: flex; align-items: center; gap: 10px; margin-top: 10px; }
#sizes { display: flex; gap: 6px; background: rgba(255,255,255,.7); border-radius: 999px; padding: 4px 8px; }
.sz { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.sz i { display: block; border-radius: 50%; background: #333; }
.sz.on { background: #fff; outline: 3px solid #2f6df0; }
#colors { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 6px 4px; scrollbar-width: none; }
#colors::-webkit-scrollbar { display: none; }
.cl { width: 38px; height: 38px; border-radius: 50%; flex: none; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.cl.on { transform: scale(1.2); outline: 3px solid #2f6df0; outline-offset: 1px; }

/* number mode */
#cbn { background: #f6f4f1; }
#cbn .bar .pct { min-width: 54px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
#zw { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #f6f4f1; border-radius: 14px; }
#zin { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#zin svg { display: block; width: 100%; height: 100%; }
#zin .reg { stroke: #3a3a3a; stroke-width: .6; stroke-linejoin: round; cursor: pointer; transition: fill .25s; }
#zin.far .lbl.sm { display: none; }
#zin .lbl { font-weight: 600; fill: #333; text-anchor: middle; dominant-baseline: central; pointer-events: none; font-family: 'Fredoka', sans-serif; }
#zin .reg.pulse { animation: pulse .45s 4; }
#zin .reg.pop { animation: pop .35s; }
@keyframes pulse { 50% { fill: #ffe14a; } }
@keyframes pop { 40% { filter: brightness(1.35); } }
#zbtns { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
#zbtns button.on { background: #ffd23f; }
#zbtns button { width: 36px; height: 36px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); font-size: 22px; font-weight: 700; line-height: 1; }
#pal { width: 100%; flex: none; display: flex; gap: 10px; overflow-x: auto; padding: 12px 6px 8px; margin-top: 6px; scrollbar-width: none; }
#pal::-webkit-scrollbar { display: none; }
.pn { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 18px; position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.pn.on { transform: scale(1.18); outline: 4px solid #2f6df0; outline-offset: 2px; }
.pn.done { opacity: .4; font-size: 0; } .pn.done::after { content: "\2713"; font-size: 22px; }
#toast { position: fixed; left: 50%; top: 66px; transform: translateX(-50%); background: rgba(35,48,94,.92); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 16px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; white-space: nowrap; z-index: 40; }
#toast.on { opacity: 1; }

/* menu, gallery and dialogs */
.ov { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(180deg, #1252b8, #08307f 70%, #072a6e); color: #fff; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
h1 { margin: 0; font-size: 52px; line-height: 1; color: #ffd451; text-shadow: 0 4px 0 #b57e00; text-align: center; }
.sub { margin: 10px 0 24px; font-size: 19px; color: #cfe0ff; text-align: center; font-weight: 500; max-width: 320px; }
.menu { display: flex; flex-direction: column; gap: 16px; width: min(100%, 330px); }
.btn { min-height: 74px; border-radius: 28px; background: #fff; color: #1d5fe0; font-size: 26px; font-weight: 700; box-shadow: 0 6px 0 #a9c3ee; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 16px; line-height: 1.05; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a9c3ee; }
.btn small { display: block; font-size: 15px; font-weight: 500; opacity: .85; }
.btn .em { font-size: 38px; }
.btn.free { background: #ff8a3d; color: #fff; box-shadow: 0 6px 0 #c4561a; }
.btn.num { background: #46c97f; color: #fff; box-shadow: 0 6px 0 #26995a; }
.btn.pri { background: #ffd451; color: #7a4a00; box-shadow: 0 6px 0 #c9971a; min-height: 60px; }
.link { margin-top: 4px; font-size: 18px; font-weight: 600; color: #cfe0ff; text-align: center; padding: 8px; }
.logo { display: flex; gap: 6px; margin-bottom: 14px; }
.logo i { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
#gal { background: #fff; color: var(--ink); justify-content: flex-start; padding: 0; }
#gal.free { background: linear-gradient(180deg, #ffc84a, #ffad2b); } #gal.num { background: #f6f4f1; }
#grid { width: 100%; flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; align-content: start; padding: 6px 4px 18px; }
.card { background: #fff; border-radius: 18px; padding: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.14); text-align: center; position: relative; }
.card:active { transform: translateY(2px); }
.card svg { width: 100%; height: auto; display: block; border-radius: 10px; background: #fff; }
.card b { display: block; margin-top: 6px; font-size: 17px; font-weight: 600; }
.card .bd { position: absolute; right: 10px; top: 10px; background: #46d36b; color: #fff; border-radius: 12px; padding: 1px 8px; font-size: 13px; font-weight: 600; }
.card .pg { height: 6px; border-radius: 3px; background: #e6e6ee; margin-top: 6px; overflow: hidden; } .card .pg i { display: block; height: 100%; background: #46c97f; }
#fin img, #fin canvas { max-width: min(86vw, 420px); max-height: 38vh; border-radius: 16px; border: 6px solid #bcd3ff; background: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
#fin .vw { margin: 14px 0 20px; }
#fin h1 { font-size: 40px; }
#fin .menu { gap: 10px; } #fin .btn { min-height: 56px; font-size: 22px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
#confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); } }
#coach { position: fixed; inset: 0; z-index: 20; display: none; }
#coach.on { display: block; }
#hole { position: absolute; border-radius: 22px; box-shadow: 0 0 0 100vmax rgba(8,18,60,.72); transition: all .25s; pointer-events: none; }
#bubble { position: absolute; left: 50%; width: min(86%, 340px); transform: translateX(-50%); background: #fff; color: var(--ink); border-radius: 22px; padding: 14px 18px; font-size: 19px; font-weight: 500; line-height: 1.3; box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: bpop .3s; }
#bubble b { color: #1d5fe0; font-weight: 700; }
#bubble small { display: block; margin-top: 8px; font-size: 14px; color: #8091c0; }
@keyframes bpop { from { opacity: 0; transform: translateX(-50%) scale(.92); } }
</style>
</head>
<body>

<!-- free coloring -->
<div class="scr hidden" id="free"><div class="wrap">
  <div class="bar">
    <button class="rb back" id="fBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#123" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="fTitle">Free Coloring</h2>
    <button class="rb yel" id="fUndo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="#123" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 2.6 5.9M4 6v6h6"/></svg></button>
    <button class="rb cy" id="fClear" aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="#123" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
    <button class="rb ok" id="fDone" aria-label="Done"><svg viewBox="0 0 24 24" fill="none" stroke="#123" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg></button>
  </div>
  <div id="freeStage"><div id="paper"><svg id="under" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"></svg><canvas id="paint" width="800" height="800"></canvas><svg id="over" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"></svg><div id="cap"></div></div></div>
  <div id="tools"></div>
  <div id="sizeRow"><div id="sizes"></div><div id="colors"></div></div>
</div></div>

<!-- color by number -->
<div class="scr hidden" id="cbn"><div class="wrap">
  <div class="bar">
    <button class="rb back" id="nBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#123" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="nTitle">Color by Number</h2>
    <span class="pct" id="nPct">0%</span>
    <button class="rb yel" id="nRestart" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="#123" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 2.6 5.9M4 6v6h6"/></svg></button>
    <button class="rb hint" id="nHint" aria-label="Hint"><svg viewBox="0 0 24 24" fill="#ffd451" stroke="#8a6200" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3z"/><path d="M9.5 20h5" stroke-linecap="round"/></svg><span class="n" id="nHintN">3</span></button>
  </div>
  <div id="cbnStage"><div id="zw"><div id="zin"></div><div id="zbtns"><button id="zMove" aria-label="Move around" title="Move around">&#9995;</button><button id="zIn">+</button><button id="zOut">&minus;</button></div></div></div>
  <div id="pal"></div>
  <div id="toast"></div>
</div></div>

<!-- gallery -->
<div class="scr hidden" id="gal"><div class="wrap">
  <div class="bar"><button class="rb back" id="gBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#123" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="gTitle">Pick a picture</h2><span style="width:42px"></span></div>
  <div id="grid"></div>
</div></div>

<!-- menu -->
<div class="ov" id="menu">
  <div class="logo"><i style="background:#ef4444"></i><i style="background:#facc15"></i><i style="background:#22c55e"></i><i style="background:#3b82f6"></i><i style="background:#a855f7"></i></div>
  <h1>Color Splash</h1>
  <p class="sub">Paint any way you like, or follow the numbers to reveal a picture.</p>
  <div class="menu">
    <button class="btn free" id="mFree"><span class="em">&#127912;</span><span>Free Coloring<small>paint anything, any color</small></span></button>
    <button class="btn num" id="mNum"><span class="em">&#128290;</span><span>Color by Number<small>match numbers to colors</small></span></button>
  </div>
</div>

<!-- finished dialog -->
<div class="ov hidden" id="fin">
  <h1 id="finT">Great job!</h1>
  <div class="vw" id="finV"></div>
  <div class="menu"><button class="btn pri" id="finA">Next picture</button><button class="btn pri" id="finD" style="background:#7fe0ff;box-shadow:0 6px 0 #3aa6cf;color:#06465f">Start over</button><button class="btn" id="finB" style="min-height:60px">All pictures</button><button class="link" id="finC">Keep coloring</button></div>
</div>
<div class="ov hidden" id="cfm"><h1 style="font-size:36px">Start over?</h1><p class="sub">This clears all the colors on this picture.</p><div class="menu"><button class="btn pri" id="cfmY">Yes, restart</button><button class="btn" id="cfmN" style="min-height:60px">Cancel</button></div></div>
<div id="confetti"></div>
<div id="coach"><div id="hole"></div><div id="bubble"></div></div>

const thumb = (p, fills, sw) => `<svg xmlns="${NS}" viewBox="0 0 ${V} ${V}">${p.regions.map((r, i) => `<path d="${r.d}" fill="${fills && fills[i] || '#fff'}" fill-rule="evenodd"/>`).join('')}${outlineSVG(p, sw || 2.4)}</svg>`;
const lum = h => { const n = parseInt(h.slice(1), 16); return ((n >> 16 & 255) * .299 + (n >> 8 & 255) * .587 + (n & 255) * .114); };
const show = id => $(id).classList.remove('hidden'), hide = id => $(id).classList.add('hidden');
const confetti = () => { const box = $('confetti'); box.innerHTML = ''; const cs = ['#ef4444', '#facc15', '#22c55e', '#3b82f6', '#a855f7', '#ec4899']; for (let i = 0; i < 70; i++) { const q = document.createElement('i'); q.style.left = Math.random() * 100 + '%'; q.style.background = cs[i % 6]; q.style.setProperty('--dx', (Math.random() - .5) * 160 + 'px'); q.style.setProperty('--rot', Math.random() * 900 + 'deg'); q.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; q.style.animationDelay = Math.random() * .5 + 's'; box.appendChild(q); } setTimeout(() => { box.innerHTML = ''; }, 4200); };
let tt = 0; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1300); }

/* ---------- tutorial (every time a picture opens) ---------- */
let coachOn = false, coachI = 0, COACH = [];
function coachStep() {
  const c = $('coach');
  if (coachI >= COACH.length) { c.classList.remove('on'); coachOn = false; return; }
  const st = COACH[coachI], r = $(st.sel).getBoundingClientRect(), h = $('hole'), b = $('bubble');
  c.classList.add('on'); coachOn = true;
  h.style.left = r.left - 6 + 'px'; h.style.top = r.top - 6 + 'px'; h.style.width = r.width + 12 + 'px'; h.style.height = r.height + 12 + 'px';
  b.innerHTML = st.t + `<small>Tap to continue (${coachI + 1}/${COACH.length})</small>`; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  const bh = b.offsetHeight; let top = st.pos === 'above' ? r.top - bh - 18 : r.bottom + 18;
  if (top + bh > innerHeight - 8) top = Math.max(8, r.top - bh - 18); if (top < 8) top = r.bottom + 18; b.style.top = top + 'px';
}
const startCoach = steps => { COACH = steps; coachI = 0; setTimeout(coachStep, 120); };
$('coach').addEventListener('pointerdown', e => { e.preventDefault(); coachI++; coachStep(); beep(900, .04); });

let mode = 'free', cur = null;

function openGallery(m) {
  mode = m; const g = $('gal'); g.className = 'scr ' + (m === 'free' ? 'free' : 'num'); $('gTitle').textContent = m === 'free' ? 'Free Coloring' : 'Color by Number';
  $('grid').innerHTML = PICS.map((p, i) => {

    else { const st = loadCbn(p), fl = {}; p.regions.forEach((r, j) => { if (st[j]) fl[j] = p.pal[r.k - 1]; }); const n = Object.keys(st).length, pct = Math.round(100 * n / p.regions.length); inner = thumb(p, fl, 1.6); extra = pct >= 100 ? '<span class="bd">&#10003; Done</span>' : ''; if (pct > 0 && pct < 100) extra = `<div class="pg"><i style="width:${pct}%"></i></div>`; }

}

/* ======================= COLOR BY NUMBER ======================= */

$('nBack').onclick = () => { if (coachOn) return; hide('cbn'); openGallery('num'); };
