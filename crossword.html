<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Crossword Pop</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --clue: #cfe3f7; --clueD: #b4cfec; --cell: #f4f9ff; --line: #8fb0d2; --ink: #17365d; --sel: #ffd451; --word: #fff0b3;
  --bad: #e5484d; --good: #1f9d6a; --purple: #7b4fc4; --purpleD: #5a3794; --teal: #0e9f94; --tealD: #0a7d75;
  --bg1: #eaf4fd; --bg2: #dbeafb;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: linear-gradient(180deg, var(--bg1), var(--bg2)); }
button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; padding: 0; }
#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); }

/* header */
#top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; flex: none; font-weight: 600; font-size: 18px; }
#top .l, #top .r { display: flex; align-items: center; gap: 10px; }
#home { width: 38px; height: 38px; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 #bfd2e8; display: grid; place-items: center; }
#home:active { transform: translateY(2px); box-shadow: 0 1px 0 #bfd2e8; }
#lvl { color: #0f5fa8; font-weight: 700; }
#lvl small { font-weight: 600; color: #5d7da0; margin-left: 4px; }
#prog { background: #fff; border-radius: 12px; padding: 4px 10px; font-size: 15px; color: #3e5f86; box-shadow: 0 2px 0 #bfd2e8; }
#time { min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; color: #51698a; }

/* board */
#scroller { flex: 1 1 auto; min-height: 120px; width: 100%; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 4px 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#scroller::-webkit-scrollbar { display: none; }
#board { position: relative; display: grid; border: 3px solid #5f8dc0; border-radius: 10px; background: var(--line); gap: 1px; box-shadow: 0 8px 0 rgba(63,109,168,.18), 0 14px 26px rgba(30,60,110,.16); margin: auto; flex: none; }
.c { position: relative; background: var(--cell); display: grid; place-items: center; font-weight: 700; color: var(--ink); cursor: pointer; overflow: visible; }
.c.k { background: var(--clue); cursor: pointer; }
.c.x { background: var(--clue); cursor: default; }
.c.x::after { content: ''; width: 34%; height: 34%; border-radius: 50%; background: rgba(255,255,255,.55); }
.c.k.hl { background: #a7ccf2; }
.c.w.inword { background: var(--word); }
.c.w.sel { background: var(--sel); box-shadow: inset 0 0 0 3px #f0a800; z-index: 2; }
.c.w.bad .ch { color: var(--bad); }
.c.w.hinted .ch { color: var(--teal); }
.c.w.ok { background: #d7f5e4; }
.c.w.ok.sel { background: var(--sel); }
.ch { line-height: 1; pointer-events: none; }
.c.w.pop .ch { animation: letter .22s; }
@keyframes letter { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
.c.w.flash { animation: wflash .7s; }
@keyframes wflash { 35% { background: #9be8bd; transform: scale(1.1); z-index: 3; } }
.c.w.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
/* clue cells */
.cl { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 600; text-transform: uppercase; line-height: 1.05; color: #1d3b5f; padding: 0 3px; overflow: hidden; word-break: keep-all; pointer-events: none; }
.cl.top { top: 0; }
.cl.bot { bottom: 0; }
.cl.full { top: 0; bottom: 0; }
.cl.split { border-bottom: 1px solid #a2c0e0; }
.cl.on { background: rgba(255,212,81,.55); }
.cl svg { width: 78%; height: 78%; display: block; }
.ar { position: absolute; width: 0; height: 0; z-index: 3; pointer-events: none; }
.ar.r { right: -6px; border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent; border-left: 7px solid #4f86c2; transform: translateY(-50%); }
.ar.d { bottom: -6px; border-left: 5.5px solid transparent; border-right: 5.5px solid transparent; border-top: 7px solid #4f86c2; transform: translateX(-50%); }

/* clue bar */
#bar { width: 100%; flex: none; min-height: 46px; margin-top: 6px; background: #fff; border-radius: 14px; box-shadow: 0 3px 0 #bfd2e8; display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
#bar .dir { flex: none; width: 28px; height: 28px; border-radius: 9px; background: #4f86c2; display: grid; place-items: center; }
#bar .dir svg { width: 16px; height: 16px; }
#bar .txt { flex: 1; font-weight: 600; font-size: 17px; line-height: 1.1; color: #1d3b5f; text-transform: uppercase; }
#bar .len { flex: none; font-size: 13px; color: #7d97b8; font-weight: 600; }
#bar .pic { flex: none; width: 34px; height: 34px; }
#bar .pic svg { width: 100%; height: 100%; }
#bar.empty .txt { color: #8aa3c2; text-transform: none; font-weight: 500; }

/* tools */
#tools { width: 100%; flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.tool { position: relative; height: 44px; border-radius: 14px; background: var(--purple); color: #fff; box-shadow: 0 4px 0 var(--purpleD); display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; font-weight: 600; }
.tool svg { width: 20px; height: 20px; }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--purpleD); }
.tool.teal { background: var(--teal); box-shadow: 0 4px 0 var(--tealD); } .tool.teal:active { box-shadow: 0 1px 0 var(--tealD); }
.tool.pink { background: #e0406f; box-shadow: 0 4px 0 #a82a50; } .tool.pink:active { box-shadow: 0 1px 0 #a82a50; }
.tool .badge { position: absolute; right: -4px; top: -7px; min-width: 22px; height: 22px; border-radius: 11px; background: #ff9d1c; color: #fff; font-size: 13px; display: grid; place-items: center; box-shadow: 0 2px 0 #c46a00; padding: 0 5px; }
.tool.off { opacity: .45; }

/* keyboard */
#kb { width: 100%; flex: none; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; justify-content: center; gap: 5px; }
.key { flex: 1 1 0; max-width: 46px; height: clamp(38px, 5.6dvh, 48px); border-radius: 10px; background: #fff; box-shadow: 0 3px 0 #bfd2e8; font-size: 21px; font-weight: 600; color: #17365d; display: grid; place-items: center; }
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 #bfd2e8; background: #f1f7ff; }
.key.wide { flex: 1.5 1 0; max-width: 70px; background: #ffe1e8; color: #c0345a; }
.key svg { width: 22px; height: 22px; }

/* coach */
#coach { position: fixed; inset: 0; z-index: 8; display: none; }
#coach.on { display: block; }
#hole { position: absolute; border-radius: 14px; box-shadow: 0 0 0 4px #fff, 0 0 0 9999px rgba(15, 35, 70, .66); pointer-events: none; transition: all .25s; }
#bubble { position: absolute; left: 50%; transform: translateX(-50%); width: min(86vw, 340px); background: #fff; border-radius: 20px; padding: 14px 18px 12px; font-weight: 600; font-size: 18px; line-height: 1.25; color: #26384c; box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 16px 30px rgba(0,0,0,.25); animation: rise .25s both; }
#bubble b { color: #0f5fa8; }
#bubble small { display: block; margin-top: 8px; color: #8aa0b8; font-size: 13px; font-weight: 600; }

/* overlays */
.ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15, 40, 80, .5); backdrop-filter: blur(3px); z-index: 10; padding: 16px; animation: fade .2s; }
.ov.hidden { display: none; }
@keyframes fade { from { opacity: 0; } }
.panel { background: #fff; border-radius: 26px; padding: 24px 24px 26px; width: min(100%, 390px); max-height: 94dvh; overflow: auto; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.14), 0 24px 44px rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 12px; animation: rise .3s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes rise { from { transform: translateY(24px) scale(.94); opacity: 0; } }
.panel h1 { margin: 0; font-size: 44px; line-height: 1; color: #0f5fa8; }
.panel h2 { margin: 0; font-size: 36px; color: #0f5fa8; }
.panel p { margin: 0; font-size: 18px; color: #51647a; font-weight: 500; }
.panel .big { font-size: 40px; font-weight: 700; color: var(--ink); }
.stars { font-size: 54px; letter-spacing: 6px; color: #ffc21a; text-shadow: 0 4px 0 #c88a00; line-height: 1; }
.stars i { color: #d3dde9; text-shadow: none; font-style: normal; }
.btn { height: 56px; border-radius: 18px; font-size: 24px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0 20px; }
.btn:active { transform: translateY(4px); }
.b-blue { background: #2f8cf0; box-shadow: 0 6px 0 #1d5fae; } .b-blue:active { box-shadow: 0 2px 0 #1d5fae; }
.b-green { background: #36b86b; box-shadow: 0 6px 0 #1f8a45; } .b-green:active { box-shadow: 0 2px 0 #1f8a45; }
.b-ghost { background: #edf3f9; color: #3b5470; box-shadow: 0 6px 0 #cfdbe8; font-size: 20px; height: 48px; } .b-ghost:active { box-shadow: 0 2px 0 #cfdbe8; }
.logo { display: grid; grid-template-columns: repeat(4, 30px); grid-template-rows: repeat(3, 30px); gap: 3px; margin: 0 auto 2px; }
.logo i { background: #fff; border: 2px solid #8fb0d2; border-radius: 6px; font-style: normal; font-weight: 700; color: #17365d; display: grid; place-items: center; font-size: 18px; }
.logo i.k { background: #cfe3f7; border-color: #cfe3f7; color: #4f86c2; font-size: 14px; }
.logo i.y { background: #ffd451; border-color: #f0a800; }

/* level grid */
#levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.lv { height: 82px; border-radius: 18px; color: #fff; text-align: left; padding: 8px 14px; box-shadow: 0 6px 0 rgba(0,0,0,.2); position: relative; display: flex; flex-direction: column; justify-content: center; }
.lv:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.lv b { font-size: 30px; line-height: 1; }
.lv span { font-size: 14px; font-weight: 600; opacity: .95; margin-top: 2px; }
.lv .st { position: absolute; right: 10px; top: 8px; font-size: 16px; letter-spacing: 1px; color: #ffe27a; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.lv .st i { color: rgba(255,255,255,.4); font-style: normal; }
.lv.lock { background: #9fb3c6 !important; box-shadow: 0 6px 0 #7a8da0 !important; pointer-events: none; }
.lv.lock::after { content: ''; position: absolute; right: 18px; top: 50%; width: 22px; height: 16px; margin-top: -2px; background: #51657a; border-radius: 4px; }
.lv.lock::before { content: ''; position: absolute; right: 22px; top: 22px; width: 14px; height: 14px; border: 4px solid #51657a; border-bottom: 0; border-radius: 10px 10px 0 0; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
#confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="l"><button id="home" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#3b5470" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7M6 10v9h4v-5h4v5h4v-9"/></svg></button><span id="lvl">Level 1</span></div>
    <div class="r"><span id="prog">0/0</span><span id="time">00 : 00</span></div>
  </div>
  <div id="scroller"><div id="board"></div></div>
  <div id="bar" class="empty"><span class="dir"></span><span class="txt">Tap a square to begin</span></div>
  <div id="tools">
    <button class="tool pink" id="tCheck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Check</button>
    <button class="tool" id="tHint"><span class="badge" id="hintN">3</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>Hint</button>
    <button class="tool teal" id="tWord"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13M12 6l6 6-6 6M20 5v14"/></svg>Next</button>
  </div>
  <div id="kb"></div>
</div>

<div id="coach"><div id="hole"></div><div id="bubble"></div></div>

<div class="ov" id="menu">
  <div class="panel">
    <div class="logo"><i class="k">&#9654;</i><i class="y">C</i><i>A</i><i>T</i><i>S</i><i class="k">&#9660;</i><i>U</i><i class="k">&#9654;</i><i>N</i><i>O</i><i>W</i><i class="k">&#9660;</i></div>
    <h1>Crossword Pop</h1>
    <p>Arrows show where each answer starts. Fill in the words!</p>
    <button class="btn b-blue" id="bCont" style="display:none">Continue</button>
    <button class="btn b-green" id="bPlay">Play</button>
  </div>
</div>
<div class="ov hidden" id="lvlScr">
  <div class="panel">
    <h2>Pick a level</h2>
    <div id="levels"></div>
    <button class="btn b-ghost" id="bLvBack">Back</button>
  </div>
</div>
<div class="ov hidden" id="win">
  <div class="panel">
    <h2>Solved!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winD"></p>
    <div class="big" id="winT"></div>
    <p id="winBest"></p>
    <button class="btn b-green" id="bNext">Next level</button>
    <button class="btn b-blue" id="bAgain">Play again</button>
    <button class="btn b-ghost" id="bWinMenu">Levels</button>
  </div>
</div>
<div id="confetti"></div>

const COACH = [
  { sel: '#board', t: 'Each blue square is a <b>clue</b>. The <b>arrow</b> shows where the answer starts and which way it runs.' },
  { sel: '#board', t: 'Some clues are <b>pictures</b>. Tap a clue square or a white square to pick a word.' },
  { sel: '#kb', t: 'Type the letters with this keyboard. Tap a square twice to switch between across and down.' },
  { sel: '#tools', t: '<b>Check</b> shows wrong letters, <b>Hint</b> reveals one letter (you get 3), and <b>Next</b> jumps to another word.' }
];
function coachStep() {
  const c = $('coach');
  if (coachI >= COACH.length) { c.classList.remove('on'); coachOn = false; last = performance.now(); return; }
  const st = COACH[coachI], el = document.querySelector(st.sel), r = el.getBoundingClientRect(), h = $('hole'), b = $('bubble');
  c.classList.add('on'); coachOn = true;
  const pad = 6; h.style.left = r.left - pad + 'px'; h.style.top = r.top - pad + 'px'; h.style.width = r.width + pad * 2 + 'px'; h.style.height = r.height + pad * 2 + 'px';
  b.innerHTML = st.t + `<small>Tap to continue (${coachI + 1}/${COACH.length})</small>`;
  b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  const below = r.top + r.height / 2 < innerHeight * .5;
  if (below) b.style.top = Math.min(innerHeight - b.offsetHeight - 10, r.bottom + 18) + 'px';
  else b.style.top = Math.max(10, r.top - b.offsetHeight - 18) + 'px';
}
function startCoach() { coachI = 0; setTimeout(coachStep, 60); }
$('coach').addEventListener('pointerdown', e => { e.preventDefault(); coachI++; coachStep(); beep(900, .04); });

/* ============ save / flow ============ */
const show = id => $(id).classList.remove('hidden'), hide = id => $(id).classList.add('hidden');
function save() {
  if (!playing) return;
  store.set('cw-save', JSON.stringify({ level, variant, cur, hinted, hints, hintsUsed, elapsed, solvedW }));
}
function loadSave() {
  try {
    const s = JSON.parse(store.get('cw-save', '')); if (!s || !PUZZLES[s.level] || !PUZZLES[s.level][s.variant]) return false;
    startLevel(s.level, s.variant);
    cur = s.cur; hinted = s.hinted; hints = s.hints; hintsUsed = s.hintsUsed; elapsed = s.elapsed; solvedW = s.solvedW || [];
    render(); return true;
  } catch (e) { return false; }
}
function unlocked(i) { return i === 0 || (progress.stars[i - 1] || 0) > 0; }
function buildLevels() {
  $('levels').innerHTML = PUZZLES.map((list, i) => {
    const open = unlocked(i), st = progress.stars[i] || 0, p = list[0];
    return `<button class="lv ${open ? '' : 'lock'}" data-i="${i}" style="background:${LEVEL_INFO[i].c}"><b>${i + 1}</b><span>${LEVEL_INFO[i].n} · ${p.C - 1}×${p.R - 1}</span>${open ? `<div class="st">${'★'.repeat(st)}<i>${'★'.repeat(3 - st)}</i></div>` : ''}</button>`;
  }).join('');
}
function toMenu() {
  if (playing) save();
  playing = false; hide('win'); hide('lvlScr'); show('menu'); $('bCont').style.display = store.get('cw-save', '') ? '' : 'none';
}
$('bPlay').onclick = () => { hide('menu'); buildLevels(); show('lvlScr'); };
$('bLvBack').onclick = toMenu;
$('levels').onclick = e => { const b = e.target.closest('.lv'); if (b && !b.classList.contains('lock')) startLevel(+b.dataset.i); };
$('bCont').onclick = () => { if (!loadSave()) toMenu(); };
$('home').onclick = () => { if (coachOn) return; toMenu(); };
$('bNext').onclick = () => startLevel(level + 1);
$('bAgain').onclick = () => startLevel(level, (variant + 1) % PUZZLES[level].length);
$('bWinMenu').onclick = () => { hide('win'); buildLevels(); show('lvlScr'); };
addEventListener('keydown', e => {
  if (!playing) return;
  if (coachOn) { if (e.key === ' ' || e.key === 'Enter') { coachI++; coachStep(); } return; }
  if (/^[a-zA-Z]$/.test(e.key) && !e.ctrlKey && !e.metaKey) { type(e.key.toUpperCase()); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') { back(); return; }
  if (e.key === 'Tab') { e.preventDefault(); nextWord(); return; }
  const mv = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
  if (mv && sel >= 0) {
    e.preventDefault(); let r = ((sel / C) | 0) + mv[0], c = (sel % C) + mv[1];
    while (r >= 0 && r < R && c >= 0 && c < C) { if (P.cells[r * C + c].k === 'w') { select(r * C + c, mv[0] ? 'd' : 'a'); break; } r += mv[0]; c += mv[1]; }
  }
});
let last = performance.now();
setInterval(() => { const n = performance.now(), dt = (n - last) / 1000; last = n; if (playing && !coachOn && !document.hidden && dt < 2) { elapsed += dt; $('time').textContent = fmt(elapsed); if (((elapsed | 0) % 5) === 0) save(); } }, 250);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('resize', () => { if (P) { buildBoard(); render(); } });

window.__cw = { start: (l, v) => startLevel(l, v), get s() { return { level, variant, R, C, playing, sel, sdir, hints, words: words.length, done: words.filter(wordDone).length }; }, solve: () => { cur = ans.slice(); render(); checkWin(); }, fill: n => { let k = 0; for (let i = 0; i < ans.length && k < n; i++) if (ans[i] && cur[i] !== ans[i]) { cur[i] = ans[i]; k++; } render(); }, ans: () => ans, words: () => words, type, select, PUZZLES };
toMenu();
})();
</script>
</body>
</html>
