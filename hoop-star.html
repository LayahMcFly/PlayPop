<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hoop Star</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1b4a; font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; max-width: 100%; max-height: 100%; }
.ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(8, 18, 60, .62); backdrop-filter: blur(3px); z-index: 10; animation: fade .2s; }
.ov.hidden { display: none; }
@keyframes fade { from { opacity: 0; } }
.panel { width: min(100%, 360px); background: #fff; color: #26384c; border-radius: 28px; padding: 24px 22px 26px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 0 rgba(0,0,0,.18), 0 24px 44px rgba(0,0,0,.35); animation: rise .3s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes rise { from { transform: translateY(26px) scale(.94); opacity: 0; } }
.panel h1 { margin: 0; font-size: 46px; line-height: 1; color: #ff7a1a; text-shadow: 0 3px 0 #ffd2a8; }
.panel h2 { margin: 0; font-size: 36px; color: #1d5fe0; }
.panel p { margin: 0; font-size: 18px; font-weight: 500; color: #51647a; line-height: 1.3; }
.big { font-size: 64px; font-weight: 700; color: #ff7a1a; line-height: 1; }
.best { font-size: 18px; font-weight: 600; color: #6f86a6; }
.btn { height: 58px; border-radius: 999px; font-size: 26px; font-weight: 700; color: #fff; background: #ff7a1a; box-shadow: 0 6px 0 #c24e00; display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; font-family: inherit; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c24e00; }
.btn.blue { background: #2f8cf0; box-shadow: 0 6px 0 #1d5fae; } .btn.blue:active { box-shadow: 0 2px 0 #1d5fae; }
.how { display: flex; flex-direction: column; gap: 10px; text-align: left; font-size: 17px; font-weight: 600; color: #3b4f68; }
.how div { display: flex; align-items: center; gap: 12px; }
.how i { flex: none; width: 44px; height: 44px; border-radius: 14px; background: #fff1e4; display: grid; place-items: center; font-style: normal; font-size: 24px; }
#home { position: fixed; left: 10px; top: 10px; z-index: 5; width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.2); display: grid; place-items: center; border: 0; cursor: pointer; }
#home:active { transform: scale(.92); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="home" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7M6 10v9h4v-5h4v5h4v-9"/></svg></button>

<div class="ov" id="menu">
  <div class="panel">
    <div style="line-height:0"><svg class="ic" viewBox="0 0 48 48" width="64" height="64" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#ff8a2a" stroke="#a84600" stroke-width="2.5"/><g fill="none" stroke="#7a3300" stroke-width="2.5" stroke-linecap="round"><path d="M24 5v38M5 24h38M9 11c8 7 8 19 0 26M39 11c-8 7-8 19 0 26"/></g></svg></div>
    <h1>Hoop Star</h1>
    <p>The hoop keeps moving, and it gets faster and tighter as you score.</p>
    <div class="best" id="menuBest"></div>
    <button class="btn" id="bPlay">Play</button>
  </div>
</div>
<div class="ov hidden" id="tut">
  <div class="panel">
    <h2>How to play</h2>
    <div class="how">
      <div><i><svg class="ic" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><rect x="18" y="5" width="12" height="26" rx="6" fill="#ffd9a8" stroke="#d19a5b" stroke-width="2.5"/><rect x="11" y="23" width="26" height="21" rx="9" fill="#ffd9a8" stroke="#d19a5b" stroke-width="2.5"/><path d="M19 30v8M24 30v8M29 30v8" stroke="#e9b87c" stroke-width="2" stroke-linecap="round"/></svg></i><span>Drag back from anywhere, then let go to shoot</span></div>
      <div><i><svg class="ic" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#ff5a4d"/><circle cx="24" cy="24" r="13" fill="#fff"/><circle cx="24" cy="24" r="7.5" fill="#ff5a4d"/><circle cx="24" cy="24" r="2.5" fill="#fff"/></svg></i><span>Time it, because the hoop keeps sliding</span></div>
      <div><i><svg class="ic" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><path d="M22 3l4.5 15.5L42 23l-15.5 4.5L22 43l-4.5-15.5L2 23l15.5-4.5z" fill="#ffd84d" stroke="#f0a800" stroke-width="2" stroke-linejoin="round"/><path d="M38 4l1.8 5.2L45 11l-5.2 1.8L38 18l-1.8-5.2L31 11l5.2-1.8z" fill="#fff3a8"/></svg></i><span>A clean swish is worth 2 points</span></div>
      <div><i><svg class="ic" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><path d="M24 42C6 29 3 17 10 10c6-5 12-2 14 3 2-5 8-8 14-3 7 7 4 19-14 32z" fill="#ff4a6a" stroke="#d92a4c" stroke-width="2.5" stroke-linejoin="round"/><path d="M13 16c1-3 3-4 6-4" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></svg></i><span>3 misses and the game is over</span></div>
    </div>
    <button class="btn" id="bGo">Let's go!</button>
  </div>
</div>
<div class="ov hidden" id="over">
  <div class="panel">
    <h2>Game over</h2>
    <div class="big" id="oScore">0</div>
    <div class="best" id="oBest"></div>
    <button class="btn" id="bAgain">Play again</button>
    <button class="btn blue" id="bMenu">Menu</button>
  </div>
</div>

/* ---------- state ---------- */

function resetBall() { ball = { x: BX, y: BY, vx: 0, vy: 0, rot: 0, live: false, scored: false, touched: false, age: 0, prevY: BY }; }
function start() {

}
function showTut() { mode = 'tut'; $('menu').classList.add('hidden'); $('over').classList.add('hidden'); score = 0; lives = 3; newHoop(); resetBall(); $('tut').classList.remove('hidden'); }
function toMenu() { mode = 'menu'; $('tut').classList.add('hidden'); $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); $('menuBest').textContent = best ? 'Best: ' + best : ''; newHoop(); resetBall(); }

/* ---------- input ---------- */
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
cv.addEventListener('pointerdown', e => { if (mode !== 'play' || ball.live) return; const p = pt(e); aim = { sx: p.x, sy: p.y, x: p.x, y: p.y }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!aim) return; const p = pt(e); aim.x = p.x; aim.y = p.y; });
function release() {
  if (!aim) return; const v = shotVec(); aim = null;
  if (!v || v.len < 28) return;
  ball.vx = v.vx; ball.vy = v.vy; ball.live = true; ball.age = 0; ball.touched = false; ball.scored = false; ball.prevY = ball.y; sfx.shoot();
}
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', () => { aim = null; });
function shotVec() {
  if (!aim) return null;
  let dx = aim.sx - aim.x, dy = aim.y - aim.sy; if (dy < 8) return { vx: 0, vy: 0, len: 0 };   // must pull back (down)
  const len = Math.hypot(dx, dy), cap = Math.min(len, 230), k = 6.6 * cap / len;
  return { vx: dx * k, vy: -dy * k, len };
}
addEventListener('keydown', e => { if (e.key === 'Escape') toMenu(); });

/* ---------- physics ---------- */

function rimHit(cx, cy) {

function step(dt) {

    const hx = hoop.x, hy = hoop.y, half = hoop.w / 2;
    rimHit(hx - half, hy); rimHit(hx + half, hy);
    if (!ball.scored && ball.vy > 0 && ball.prevY < hy && ball.y >= hy && Math.abs(ball.x - hx) < half - 6) {

      const pts = swish ? 2 : 1; score += pts; streak++; netSway = 1; flashT = .4; swish ? sfx.swish() : sfx.score();
      popText(hx, hy - 40, swish ? 'SWISH! +2' : '+1', swish ? '#ffe066' : '#fff'); burst(hx, hy + 20, swish ? 26 : 14, swish ? ['#ffe066', '#ff9d1c', '#fff'] : ['#fff', '#ffb066']);
      if (streak >= 3) popText(hx, hy - 90, streak + ' in a row!', '#7fe9ff');
    }
    const out = ball.y > H + 80, longShot = ball.age > 6;
    if (mode === 'play' && (out || longShot || (ball.scored && ball.y > hy + 220))) {
      if (!ball.scored) { lives--; streak = 0; sfx.miss(); popText(Math.max(80, Math.min(W - 80, ball.x)), H - 120, 'Miss', '#ff8a8a'); if (lives <= 0) { gameOver(); } }

}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1d5fe0'); g.addColorStop(.62, '#0e3a9a'); g.addColorStop(1, '#0a2670'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // crowd lights
  for (let i = 0; i < 14; i++) { const x = (i * 83 + 20) % W, y = 80 + (i * 137) % 520, a = .08 + .1 * (.5 + .5 * Math.sin(t * 1.4 + i)); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(x, y, 3 + (i % 3), 0, 6.283); ctx.fill(); }
  // court
  const fl = ctx.createLinearGradient(0, 860, 0, H); fl.addColorStop(0, '#d98a3d'); fl.addColorStop(1, '#a8601f'); ctx.fillStyle = fl; ctx.fillRect(0, 880, W, H - 880);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 880); ctx.lineTo(W, 880); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, 960, 120, Math.PI, 0); ctx.stroke();
}
function drawBall(x, y, rot, r) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r); g.addColorStop(0, '#ffa04a'); g.addColorStop(1, '#e0640e');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#7a3206'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.arc(-r * 1.15, 0, r * .78, -1, 1); ctx.moveTo(r * 1.15, 0); ctx.arc(r * 1.15, 0, r * .78, Math.PI - 1, Math.PI + 1); ctx.stroke();
  ctx.restore();
}
function drawHoopBack() {
  const hx = hoop.x, hy = hoop.y, half = hoop.w / 2;
  // pole glow when scoring
  if (flashT > 0) { ctx.fillStyle = `rgba(255,224,102,${flashT})`; ctx.beginPath(); ctx.arc(hx, hy - 60, 120, 0, 6.283); ctx.fill(); }
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#fff'; rr(hx - half - 28, hy - 150, hoop.w + 56, 126, 12); ctx.fill(); ctx.restore();
  ctx.strokeStyle = '#d9e4f5'; ctx.lineWidth = 5; rr(hx - half - 28, hy - 150, hoop.w + 56, 126, 12); ctx.stroke();
  ctx.strokeStyle = '#ff5a3c'; ctx.lineWidth = 5; rr(hx - 38, hy - 78, 76, 54, 6); ctx.stroke();
}
function drawHoopFront() {
  const hx = hoop.x, hy = hoop.y, half = hoop.w / 2, sw = netSway * 10 * Math.sin(t * 30);
  // net
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.4;
  const bot = hy + 78, nw = half * .62;
  for (let i = 0; i <= 6; i++) { const f = i / 6, x0 = hx - half + f * half * 2, x1 = hx - nw + f * nw * 2 + sw; ctx.beginPath(); ctx.moveTo(x0, hy); ctx.lineTo(x1, bot); ctx.stroke(); }
  for (let j = 1; j <= 4; j++) { const f = j / 5, y = hy + f * 78, w2 = half - (half - nw) * f; ctx.beginPath(); ctx.moveTo(hx - w2 + sw * f, y); for (let i = 1; i <= 6; i++) ctx.lineTo(hx - w2 + (i / 6) * w2 * 2 + sw * f, y + (i % 2 ? 6 : 0)); ctx.stroke(); }
  // rim
  ctx.strokeStyle = '#ff5a1f'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(hx - half, hy); ctx.lineTo(hx + half, hy); ctx.stroke();
  ctx.fillStyle = '#ff7a3d'; [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(hx + s * half, hy, RIM_R, 0, 6.283); ctx.fill(); });
}
function trajectory() {
  const v = shotVec(); if (!v || v.len < 28) return;
  const d = diff(), keep = score >= 10 ? 8 : score >= 5 ? 16 : 26;       // the preview shrinks as you improve
  let x = ball.x, y = ball.y, vx = v.vx, vy = v.vy;
  for (let i = 0; i < keep; i++) {
    for (let k = 0; k < 3; k++) { vy += G * .016 / 3 * 1; x += vx * .016 / 3; y += vy * .016 / 3; }
    if (x < BR || x > W - BR) vx *= -.72;
    ctx.fillStyle = `rgba(255,255,255,${.85 - i / keep * .6})`; ctx.beginPath(); ctx.arc(x, y, 6 - i / keep * 3, 0, 6.283); ctx.fill();
  }
}
function drawHUD() {
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '700 96px Fredoka, sans-serif'; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.fillText(score, W / 2, 130); ctx.shadowBlur = 0;
  for (let i = 0; i < 3; i++) { ctx.globalAlpha = i < lives ? 1 : .25; drawIc(ctx, 'heart', W - 46 - i * 46, 48, 38); } ctx.globalAlpha = 1;
  const sp = Math.min(560, 95 + score * 15 + (score > 20 ? (score - 20) * 6 : 0)); ctx.font = '600 22px Fredoka, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.textAlign = 'left';
  ctx.fillText('Speed ' + (sp / 95).toFixed(1) + 'x', 66, 40 + 12);
}
function draw() {
  ctx.save(); if (shake > .3) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawBg(); drawHoopBack();
  if (aim && !ball.live) trajectory();
  // ball shadow
  if (!ball.live) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(ball.x, 884, 30, 8, 0, 0, 6.283); ctx.fill(); }
  drawBall(ball.x, ball.y, ball.rot, BR);
  drawHoopFront();
  parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.l); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }); ctx.globalAlpha = 1;
  pops.forEach(p => { ctx.globalAlpha = Math.min(1, p.a * 1.5); ctx.textAlign = 'center'; ctx.font = '700 44px Fredoka, sans-serif'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeText(p.s, p.x, p.y); ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, p.y); }); ctx.globalAlpha = 1;
  if (mode === 'play' || mode === 'over') drawHUD();
  if (mode === 'play' && !ball.live && !aim && score === 0 && lives === 3) { ctx.textAlign = 'center'; ctx.font = '600 28px Fredoka, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText('Drag back and let go', W / 2, 700 + Math.sin(t * 4) * 6); }
  ctx.restore();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (mode === 'play' || mode === 'over' || mode === 'menu' || mode === 'tut') { if (mode === 'menu' || mode === 'tut') { t += dt; hoopUpdate(dt * .6); } else step(dt); }
  draw(); requestAnimationFrame(loop);
}
$('bPlay').onclick = showTut; $('bGo').onclick = start; $('bAgain').onclick = showTut; $('bMenu').onclick = toMenu; $('home').onclick = toMenu;
window.__hs = { freeze: b => { frz = b; }, get s() { return { mode, score, lives, ball: { ...ball }, hoop: { ...hoop } }; }, start, setScore: n => { score = n; }, shootAt: (vx, vy) => { ball.vx = vx; ball.vy = vy; ball.live = true; ball.age = 0; ball.touched = false; ball.scored = false; ball.prevY = ball.y; }, aimShot: () => {
  // find a launch that drops through the hoop (used only for testing): brute force a few trial shots
  for (let vx = -700; vx <= 700; vx += 4) for (let vy = -1500; vy <= -1000; vy += 6) { let x = ball.x, y = ball.y, a = vx, b = vy, hit = false, px = y; for (let i = 0; i < 400; i++) { b += G * .005; x += a * .005; px = y; y += b * .005; if (b > 0 && px < hoop.y && y >= hoop.y) { hit = Math.abs(x - hoop.x) < 20; break; } if (y > H) break; } if (hit) return { vx, vy }; }
  return null; } };
toMenu(); requestAnimationFrame(loop);
})();
